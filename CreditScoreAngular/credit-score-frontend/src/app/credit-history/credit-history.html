<div class = "container">
    <h2>Manage Credit History</h2>
    <div class = "row">
        <input type = "number" name ="CustomerId" [(ngModel)]="customerId" placeholder = "Enter Customer ID">
        <button type = "button" (click)="onLoadHistory()">Load Profile</button>
    </div>
    <hr>

    <form [formGroup]="creditForm" (ngSubmit) = "onSubmit()">
        <input type = "number" formControlName = "totalLoans" placeholder = "Total Loans">
         <input type = "number" formControlName = "activeLoans" placeholder = "Active Loans">
          <input type = "number" formControlName = "latePayments" placeholder = "Late payments">
           <input type = "number" formControlName = "defaults" placeholder = "Defaults">
            <input type = "number" formControlName = "creditCardUsage" placeholder = "Usage %">
             
            <div class = "buttons">
            <button type = "submit" [disabled] = "creditForm.invalid">
                {{ isEditMode ? 'Update Profile' : 'Save Profile' }}
            </button>
            <button type = "button" (click) = "onClear()">Clear</button>
            </div>
    </form>
    </div>
